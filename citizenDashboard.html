<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Services Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart."></script>
  <style>
    :root {
      --navy:    #0a1628;
      --navy2:   #112240;
      --sidebar: #0d1e36;
      --saffron: #FF9933;
      --green:   #138808;
      --white:   #f8fafc;
      --muted:   #94a3b8;
      --border:  rgba(255,255,255,0.08);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      overflow-x: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: 'Noto Sans', sans-serif;
    }

    /* decorative bg at z-index -1 so it never interferes */
    .bg-deco {
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(255,153,51,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 80%, rgba(19,136,8,0.07) 0%, transparent 60%);
    }
    .bg-grid {
      position:fixed; inset:0; z-index:-1; pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size:60px 60px;
    }

    /* ══ LAYOUT ══ */
    .layout { display:flex; min-height:100vh; }

    /* ══ SIDEBAR ══ */
    .sidebar {
      width:260px; flex-shrink:0;
      background: var(--sidebar);   /* solid colour — zero transparency, zero blur */
      border-right:1px solid var(--border);
      display:flex; flex-direction:column;
    }

    .sb-header {
      padding:24px 20px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(135deg, rgba(255,153,51,0.08), rgba(19,136,8,0.05));
    }
    .sb-logo { display:flex; align-items:center; gap:11px; margin-bottom:4px; }
    .sb-emblem {
      width:40px; height:40px; flex-shrink:0;
      background:linear-gradient(135deg,var(--saffron),#e07010);
      border-radius:10px; display:flex; align-items:center; justify-content:center;
      font-size:20px; box-shadow:0 4px 18px rgba(255,153,51,0.4);
      animation:pulseLogo 3s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%,100% { box-shadow:0 4px 18px rgba(255,153,51,0.4); }
      50%      { box-shadow:0 4px 30px rgba(255,153,51,0.75); }
    }
    .sb-header h2 {
      font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:700; line-height:1.2;
    }
    .sb-sub { font-size:11px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; }

    .sb-nav { padding:14px 10px; flex:1; overflow-y:auto; }
    .nav-lbl {
      font-size:10px; letter-spacing:.12em; text-transform:uppercase;
      color:var(--muted); padding:8px 12px 4px; margin-top:6px;
    }
    .sb-nav button {
      width:100%; padding:13px 14px; margin-bottom:3px;
      border:none; background:transparent; color:rgba(248,250,252,0.72);
      border-radius:10px; cursor:pointer;
      font-size:14px; font-family:'Noto Sans',sans-serif; font-weight:500;
      transition:background .18s, color .18s, transform .18s;
      text-align:left; display:flex; align-items:center; gap:12px;
    }
    .sb-nav button .ni { font-size:17px; width:22px; text-align:center; flex-shrink:0; }
    .sb-nav button:hover  { background:rgba(255,153,51,0.1); color:#fff; transform:translateX(2px); }
    .sb-nav button.active {
      background:linear-gradient(135deg,rgba(255,153,51,0.2),rgba(255,153,51,0.08));
      color:var(--saffron); border-left:3px solid var(--saffron);
    }
    .sb-footer {
      padding:14px 18px; border-top:1px solid var(--border);
      font-size:11px; color:var(--muted); text-align:center;
    }

    /* ══ OVERLAY ══ */
    .overlay {
      display:none; position:fixed; inset:0;
      background:rgba(0,0,0,0.62);
      z-index:998;   /* BELOW sidebar (999) */
      /* NO backdrop-filter — that was the blur culprit */
    }
    .overlay.open { display:block; }

    /* ══ MAIN ══ */
    .main { flex:1; min-width:0; padding:18px; overflow-x:hidden; }

    /* ── NAVBAR ── */
    .navbar {
      display:flex; align-items:center; justify-content:space-between;
      background:#112240; border:1px solid var(--border);
      border-radius:14px; padding:13px 20px; margin-bottom:20px;
      box-shadow:0 6px 24px rgba(0,0,0,0.25); gap:10px;
    }
    .nav-l { display:flex; align-items:center; gap:12px; }
    .nav-r { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; }

    .hamburger {
      display:none; width:38px; height:38px;
      border:1px solid rgba(255,153,51,0.3); background:rgba(255,153,51,0.1);
      border-radius:9px; cursor:pointer; font-size:22px; color:#fff;
      align-items:center; justify-content:center; flex-shrink:0;
    }
    .welcome h2 { font-family:'Rajdhani',sans-serif; font-size:19px; font-weight:700; letter-spacing:.02em; }
    .welcome span { font-size:12px; color:var(--muted); }

    .online-badge {
      display:flex; align-items:center; gap:6px;
      background:rgba(19,136,8,0.14); border:1px solid rgba(19,136,8,0.3);
      border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500;
    }
    .dot { width:7px; height:7px; background:var(--green); border-radius:50%; animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #userEmail {
      background:rgba(255,255,255,0.06); border:1px solid var(--border);
      border-radius:999px; padding:7px 13px; font-size:13px;
      max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .logout-btn {
      padding:7px 14px; border:1px solid rgba(239,68,68,0.4);
      background:rgba(239,68,68,0.1); color:#f87171;
      border-radius:8px; cursor:pointer; font-size:13px;
      font-family:'Noto Sans',sans-serif; white-space:nowrap; transition:background .2s;
    }
    .logout-btn:hover { background:rgba(239,68,68,0.22); }

    /* ── CONTENT ── */
    #content { animation:fadeUp .35s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

    /* ── TICKER ── */
    .ticker {
      display:flex; align-items:center; gap:10px; overflow:hidden;
      background:linear-gradient(90deg,rgba(255,153,51,0.1),rgba(19,136,8,0.06));
      border:1px solid rgba(255,153,51,0.18); border-radius:10px;
      padding:9px 16px; margin-bottom:20px;
    }
    .ticker-tag {
      font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase;
      background:var(--saffron); color:var(--navy);
      padding:3px 8px; border-radius:5px; flex-shrink:0;
    }
    .ticker-wrap { overflow:hidden; flex:1; }
    .ticker-belt {
      display:flex; gap:60px; white-space:nowrap;
      animation:tickerRoll 28s linear infinite;
    }
    .ticker-belt span { font-size:13px; color:rgba(248,250,252,.8); }
    .ticker-belt span::before { content:'🔔 '; }
    @keyframes tickerRoll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    /* ── CARDS ── */
    .cards {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
      gap:16px; margin-bottom:20px;
    }
    .card {
      background:#112240; border:1px solid var(--border);
      border-radius:14px; padding:22px 18px;
      transition:transform .25s, box-shadow .25s;
      position:relative; overflow:hidden;
      animation:slideUp .45s ease both;
    }
    .card:nth-child(1){animation-delay:.04s} .card:nth-child(2){animation-delay:.09s}
    .card:nth-child(3){animation-delay:.14s} .card:nth-child(4){animation-delay:.19s}
    @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0;
      height:3px; border-radius:14px 14px 0 0;
    }
    .card.c1::before{background:linear-gradient(90deg,#FF9933,#ffcc00)}
    .card.c2::before{background:linear-gradient(90deg,#138808,#00c853)}
    .card.c3::before{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
    .card.c4::before{background:linear-gradient(90deg,#8b5cf6,#ec4899)}
    .card:hover { transform:translateY(-4px); box-shadow:0 16px 40px rgba(0,0,0,0.35); }
    .card-ico { font-size:26px; margin-bottom:10px; }
    .card h3  { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
    .card p   { font-family:'Rajdhani',sans-serif; font-size:30px; font-weight:700; }
    .card-chg { font-size:12px; margin-top:5px; }
    .up   { color:#4ade80; }

    /* ── CHART BOX ── */
    .chart-box {
      background:#112240; border:1px solid var(--border);
      border-radius:14px; padding:22px; margin-bottom:20px;
    }
    .chart-box h3 {
      font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700;
      color:var(--saffron); margin-bottom:16px; letter-spacing:.02em;
    }

    /* ── INFO ROW ── */
    .info-row {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:16px; margin-top:20px;
    }
    .info-card {
      background:#112240; border:1px solid var(--border); border-radius:14px; padding:20px;
    }
    .info-card h4 {
      font-family:'Rajdhani',sans-serif; font-size:15px; color:var(--saffron);
      margin-bottom:12px; letter-spacing:.03em;
    }
    .info-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);
      font-size:13px; color:rgba(248,250,252,.75);
    }
    .info-item:last-child { border-bottom:none; }
    .info-item strong { color:#fff; }

    /* ── PROGRESS ── */
    .prog-item { margin-bottom:15px; }
    .prog-lbl { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:rgba(248,250,252,.8); }
    .prog-bar  { height:7px; background:rgba(255,255,255,0.07); border-radius:999px; overflow:hidden; }
    .prog-fill { height:100%; border-radius:999px; width:0; transition:width 1.1s cubic-bezier(.4,0,.2,1); }

    /* ── SECTION BOX ── */
    .section-box {
      background:#112240; border:1px solid var(--border);
      border-radius:14px; padding:26px; animation:fadeUp .35s ease;
    }
    .section-box h2 { font-family:'Rajdhani',sans-serif; font-size:24px; font-weight:700; margin-bottom:4px; }
    .sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .section-box > p { font-size:14px; color:rgba(248,250,252,.8); line-height:1.75; margin-bottom:12px; }

    /* ── TABLE ── */
    .tbl-wrap {
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-radius:12px; border:1px solid var(--border); margin-top:18px;
    }
    table { width:100%; border-collapse:collapse; min-width:480px; }
    th,td { padding:13px 15px; text-align:left; font-size:13px; }
    th {
      background:rgba(255,153,51,0.1); color:var(--saffron);
      font-family:'Rajdhani',sans-serif; font-size:11px;
      letter-spacing:.08em; text-transform:uppercase; font-weight:700;
    }
    td { color:rgba(248,250,252,.8); border-bottom:1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,153,51,0.04); }

    .badge {
      display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600;
    }
    .badge.active  { background:rgba(19,136,8,0.18);  color:#4ade80;  border:1px solid rgba(19,136,8,0.3); }
    .badge.pending { background:rgba(255,153,51,0.13); color:var(--saffron); border:1px solid rgba(255,153,51,0.3); }
    .badge.closed  { background:rgba(148,163,184,0.08); color:var(--muted); border:1px solid var(--border); }

    /* ── SERVICE TILES ── */
    .svc-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:12px; margin-bottom:22px;
    }
    .svc-tile {
      background:#0d1e36; border:1px solid var(--border); border-radius:13px;
      padding:18px 10px; text-align:center; cursor:pointer;
      transition:all .22s; animation:slideUp .45s ease both;
    }
    .svc-tile:nth-child(1){animation-delay:.05s} .svc-tile:nth-child(2){animation-delay:.09s}
    .svc-tile:nth-child(3){animation-delay:.13s} .svc-tile:nth-child(4){animation-delay:.17s}
    .svc-tile:nth-child(5){animation-delay:.21s} .svc-tile:nth-child(6){animation-delay:.25s}
    .svc-tile:hover { background:rgba(255,153,51,0.09); border-color:rgba(255,153,51,0.3); transform:translateY(-3px) scale(1.02); }
    .svc-tile .ico  { font-size:26px; display:block; margin-bottom:7px; }
    .svc-tile span  { font-size:12px; color:rgba(248,250,252,.75); font-weight:500; line-height:1.3; }

    /* ── TIMELINE ── */
    .tl-item { display:flex; gap:14px; margin-bottom:18px; animation:fadeUp .4s ease both; }
    .tl-side  { display:flex; flex-direction:column; align-items:center; }
    .tl-dot   { width:11px; height:11px; border-radius:50%; flex-shrink:0; margin-top:3px; }
    .tl-line  { width:2px; flex:1; background:var(--border); margin-top:4px; min-height:20px; }
    .tl-body  { padding-bottom:6px; }
    .tl-body h5 { font-size:14px; font-weight:600; margin-bottom:2px; }
    .tl-body p  { font-size:12px; color:var(--muted); }

    /* ── SETTINGS ── */
    .set-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:20px; }
    .frm-grp  { margin-bottom:14px; }
    .frm-grp label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:7px; }
    .frm-grp input,
    .frm-grp select {
      width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border);
      border-radius:8px; padding:9px 13px; color:#fff;
      font-size:13px; font-family:'Noto Sans',sans-serif; outline:none; transition:border-color .2s;
    }
    .frm-grp input:focus, .frm-grp select:focus { border-color:rgba(255,153,51,0.5); }
    .frm-grp select option { background:#112240; }
    .tog-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05);
      font-size:13px; color:rgba(248,250,252,.8);
    }
    .tog-row:last-of-type { border-bottom:none; }
    .tog { width:42px; height:22px; background:rgba(255,255,255,0.1); border-radius:999px; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
    .tog.on { background:var(--green); }
    .tog::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .2s; }
    .tog.on::after { left:23px; }
    .save-btn {
      margin-top:20px; padding:11px 26px;
      background:linear-gradient(135deg,var(--saffron),#e07010);
      border:none; border-radius:10px; color:var(--navy);
      font-weight:700; font-size:14px; font-family:'Noto Sans',sans-serif;
      cursor:pointer; transition:all .2s; box-shadow:0 4px 18px rgba(255,153,51,0.3);
    }
    .save-btn:hover { transform:translateY(-2px); box-shadow:0 8px 26px rgba(255,153,51,0.4); }


    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      height: 40px;
      max-width: 180px;
      object-fit: contain;
      object-position: left center;
    }

    /* ══════════════════════
       MOBILE  ≤ 768px
    ══════════════════════ */
    @media (max-width:768px) {

      /* show hamburger */
      .hamburger { display:flex; }

      /* sidebar flies in from left as fixed panel */
      .sidebar {
        position:fixed; top:0; left:-280px; width:260px; height:100%;
        overflow-y:auto;
        z-index:999;          /* above overlay */
        background: #0d1e36;  /* must be solid */
        transition:left .28s cubic-bezier(.4,0,.2,1);
        /* disable every possible filter/blur that could leak */
        filter:none !important;
        backdrop-filter:none !important;
        -webkit-backdrop-filter:none !important;
      }
      .sidebar.open { left:0; }

      .layout { flex-direction:column; }
      .main   { padding:12px; }

      .navbar  { flex-wrap:nowrap; padding:11px 14px; }
      .welcome h2 { font-size:16px; }
      .online-badge { display:none; }
      #userEmail { max-width:110px; font-size:12px; padding:5px 10px; }
      .logout-btn { padding:6px 10px; font-size:12px; }

      .cards { grid-template-columns:repeat(2,1fr); gap:10px; }
      .card p { font-size:24px; }

      .svc-grid { grid-template-columns:repeat(3,1fr); gap:9px; }
      .info-row  { grid-template-columns:1fr; }
      .set-grid  { grid-template-columns:1fr; }
    }

    @media (max-width:400px) {
      .cards { grid-template-columns:repeat(2,1fr); }
      .svc-grid { grid-template-columns:repeat(3,1fr); }
    }
  </style>
</head>
<body>

<div class="bg-deco"></div>
<div class="bg-grid"></div>

<!-- dim overlay — sits BEHIND sidebar -->
<div class="overlay" id="overlay"></div>

<div class="layout">

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-logo">
        <div class="sb-emblem">🏛️</div>
        <div>
          <!-- <h2>Citizen Portal</h2> -->
           <div class="logo">
      <!-- <div class="logo-icon">🏛️</div> -->
      <img src="./gallery/stackly-logo (1).webp" alt="GovServe" class="logo-img" />
    </div>
          <div class="sb-sub">e-Governance Services</div>
        </div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-lbl">Main</div>
      <button id="nb-dashboard"><span class="ni">🏠</span> Dashboard</button>
      <button id="nb-services"><span class="ni">⚙️</span> My Services</button>

      <div class="nav-lbl">Administration</div>
      <button id="nb-analytics"><span class="ni">📊</span> Analytics</button>
      <button id="nb-grievance"><span class="ni">📋</span> Grievances</button>
      <button id="nb-employees"><span class="ni">👥</span> Officials</button>

      <div class="nav-lbl">Account</div>
      <button id="nb-settings"><span class="ni">🔧</span> Settings</button>
    </nav>

    <div class="sb-footer">Gov. of India · v2.5.0</div>
  </aside>

  <!-- ══ MAIN ══ -->
  <div class="main">

    <div class="navbar">
      <div class="nav-l">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="welcome">
          <h2>Welcome, Citizen 🇮🇳</h2>
          <span>Citizen Services Portal</span>
        </div>
      </div>
      <div class="nav-r">
        <div class="online-badge"><div class="dot"></div>Portal Online</div>
        <div id="userEmail">citizen@gov.in</div>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div id="content"></div>

  </div>
</div>

<script>
/* ═══════════════════════════════════
   SIDEBAR TOGGLE  (event listeners only — no inline onclick)
═══════════════════════════════════ */
const sidebar   = document.getElementById('sidebar');
const overlay   = document.getElementById('overlay');
const hamburger = document.getElementById('hamburger');

hamburger.addEventListener('click', function() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
});

overlay.addEventListener('click', closeSidebar);

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════
   NAV BUTTON LISTENERS
═══════════════════════════════════ */
const sections = ['dashboard','services','analytics','grievance','employees','settings'];

sections.forEach(function(sec) {
  var btn = document.getElementById('nb-' + sec);
  if (btn) {
    btn.addEventListener('click', function() {
      navigate(sec);
    });
  }
});

function navigate(section) {
  closeSidebar();
  /* active state */
  sections.forEach(function(s) {
    var b = document.getElementById('nb-' + s);
    if (b) b.classList.remove('active');
  });
  var active = document.getElementById('nb-' + section);
  if (active) active.classList.add('active');
  /* render */
  renderSection(section);
}

/* ═══════════════════════════════════
   LOGOUT
═══════════════════════════════════ */
document.getElementById('logoutBtn').addEventListener('click', function() {
  localStorage.clear();
  window.location.href = 'index.html';
});

/* ═══════════════════════════════════
   RENDER SECTIONS

/* ═══════════════════════════════════
   LINE CHART HELPER
═══════════════════════════════════ */
function drawLineChart(id, labels, d1, d2) {
  setTimeout(function() {
    var ctx = document.getElementById(id);
    if (!ctx) return;
    new Chart(ctx, {
      type:'line',
      data:{
        labels: labels,
        datasets:[
          { label:'Applications', data:d1, borderColor:'#FF9933',
            backgroundColor:'rgba(255,153,51,0.07)', borderWidth:2.5,
            pointBackgroundColor:'#FF9933', pointRadius:4, tension:.4, fill:true },
          { label:'Resolved', data:d2, borderColor:'#138808',
            backgroundColor:'rgba(19,136,8,0.07)', borderWidth:2.5,
            pointBackgroundColor:'#138808', pointRadius:4, tension:.4, fill:true },
        ]
      },
      options:{
        responsive:true,
        plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:12} } } },
        scales:{
          x:{ ticks:{color:'#94a3b8'}, grid:{color:'rgba(255,255,255,0.04)'} },
          y:{ ticks:{color:'#94a3b8'}, grid:{color:'rgba(255,255,255,0.04)'} }
        }
      }
    });
  }, 80);
}

/* ═══════════════════════════════════
   PROGRESS HELPER
═══════════════════════════════════ */
function drawProgress(containerId, items) {
  var el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = items.map(function(it) {
    return '<div class="prog-item">'
      + '<div class="prog-lbl"><span>'+it.label+'</span><span>'+it.pct+'%</span></div>'
      + '<div class="prog-bar"><div class="prog-fill" data-pct="'+it.pct+'" style="background:'+it.color+'"></div></div>'
      + '</div>';
  }).join('');
  setTimeout(function() {
    el.querySelectorAll('.prog-fill').forEach(function(b) {
      b.style.width = b.dataset.pct + '%';
    });
  }, 80);
}
