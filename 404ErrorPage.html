<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Error</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, Arial, sans-serif;
    }

    body{
      min-height:100vh;
      background: radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 25%),
                  radial-gradient(circle at bottom right, rgba(59,130,246,0.22), transparent 18%),
                  linear-gradient(180deg, #eff6ff 0%, #dbeafe 40%, #0f172a 100%);
      color:#102a43;
      overflow-x:hidden;
      padding:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .error-container{
      position:relative;
      width:min(100%, 760px);
      background:linear-gradient(180deg, rgba(15,23,42,0.96), rgba(15,23,42,0.88));
      border:1px solid rgba(56,189,248,0.25);
      backdrop-filter:blur(18px);
      border-radius:32px;
      padding:56px 48px;
      box-shadow:0 35px 80px rgba(15,23,42,0.35);
      text-align:center;
      overflow:hidden;
      animation:fadeIn 1.1s ease both;
    }

    .error-container::before,
    .error-container::after{
      content:'';
      position:absolute;
      border-radius:50%;
      opacity:0.35;
      filter:blur(18px);
    }

    .error-container::before{
      width:220px;
      height:220px;
      background:rgba(56,189,248,0.18);
      top:-80px;
      right:-80px;
    }

    .error-container::after{
      width:180px;
      height:180px;
      background:rgba(96,165,250,0.18);
      bottom:-70px;
      left:-70px;
    }

    .error-code{
      font-size:10rem;
      font-weight:900;
      letter-spacing:-0.06em;
      color:#7dd3fc;
      line-height:0.92;
      animation:bounce 2.2s ease-in-out infinite;
    }

    .error-title{
      font-size:2.5rem;
      margin-top:10px;
      margin-bottom:24px;
      color:#0f172a;
    }

    .error-text{
      font-size:1.05rem;
      color:#475569;
      line-height:1.9;
      max-width:580px;
      margin-inline:auto;
      margin-bottom:34px;
    }

    .error-subtle{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-bottom:32px;
      color:#0f172a;
      font-weight:600;
      letter-spacing:0.02em;
      text-transform:uppercase;
      font-size:0.9rem;
      opacity:0.82;
    }

    .error-subtle::before{
      content:'⚠️';
    }

    .error-actions{
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
    }

    .home-btn,
    .support-link{
      min-width:180px;
      padding:16px 28px;
      border-radius:14px;
      font-size:1rem;
      font-weight:700;
      transition:transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      cursor:pointer;
      border:1px solid transparent;
    }

    .home-btn{
      background:#2563eb;
      color:#ffffff;
      border-color:rgba(37,99,235,0.35);
    }

    .home-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 16px 30px rgba(37,99,235,0.24);
      background:#1d4ed8;
    }

    .support-link{
      background:transparent;
      color:#2563eb;
      border-color:rgba(37,99,235,0.18);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .support-link:hover{
      transform:translateY(-4px);
      box-shadow:0 14px 24px rgba(59,130,246,0.12);
      background:rgba(37,99,235,0.06);
    }

    .support-link span{
      display:inline-block;
      transform:translateY(2px);
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(30px);}
      to{opacity:1; transform:translateY(0);}
    }

    @keyframes bounce{
      0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);}
    }

    @media (max-width:992px){
      .error-container{
        padding:48px 36px;
      }
      .error-code{
        font-size:8rem;
      }
      .error-title{
        font-size:2.2rem;
      }
      .error-text{
        font-size:1rem;
      }
    }

    @media (max-width:768px){
      body{
        padding:18px;
        background:linear-gradient(180deg, #eff6ff 0%, #dbeafe 60%, #ffffff 100%);
      }
      .error-container{
        padding:36px 26px;
        border-radius:28px;
      }
      .error-code{
        font-size:6.5rem;
      }
      .error-title{
        font-size:2rem;
      }
      .error-text{
        font-size:0.98rem;
      }
      .error-actions{
        gap:14px;
      }
      .home-btn,
      .support-link{
        width:100%;
      }
    }

    @media (max-width:480px){
      .error-container{
        padding:28px 20px;
      }
      .error-code{
        font-size:5rem;
      }
      .error-title{
        font-size:1.75rem;
      }
      .error-text{
        font-size:0.95rem;
      }
      .error-subtle{
        font-size:0.82rem;
        margin-bottom:24px;
      }
      .home-btn,
      .support-link{
        min-width:100%;
        padding:14px 24px;
      }
    }

  </style>

</head>
<body>

  <div class="error-container">

    <!-- Floating Shapes -->

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <!-- Error Content -->

    <h1 class="error-code">404</h1>

    <h2 class="error-title">Page Not Found</h2>

    <div class="error-subtle">This page may have moved, been removed, or never existed.</div>

    <p class="error-text">
      Oops! We couldn't find the page you're looking for. Try returning to the home page or contact support if you need help.
    </p>

    <div class="error-actions">
      <button class="home-btn" onclick="goHome()">Back To Home</button>
      <a class="support-link" href="index.html">Contact Support <span>→</span></a>
    </div>

  </div>

  <script>

    function goHome(){

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
