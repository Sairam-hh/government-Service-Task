<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Portal — GovServe</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --navy:    #07111f;
      --navy2:   #0d1e36;
      --navy3:   #112240;
      --sidebar: #090f1c;
      --saffron: #FF9933;
      --saff2:   #e07010;
      --green:   #138808;
      --sky:     #38bdf8;
      --white:   #f8fafc;
      --muted:   #64748b;
      --border:  rgba(255,255,255,0.07);
      --card:    #0f1e35;
      --fh: 'Rajdhani', sans-serif;
      --fb: 'Noto Sans', sans-serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      overflow-x: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: var(--fb);
    }

    /*
      KEY FIX: bg-deco and bg-grid use z-index:-1 (negative).
      This means they NEVER create a stacking context that could
      trap the sidebar or overlay. Previously z-index:0 on these
      combined with z-index:1 on .layout was the root cause.
    */
    .bg-deco {
      position: fixed; inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 55% at 5%  15%, rgba(255,153,51,.08) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 95% 85%, rgba(19,136,8,.08)   0%, transparent 60%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(56,189,248,.04) 0%, transparent 60%);
    }
    .bg-grid {
      position: fixed; inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 58px 58px;
    }

    /* ══════════════════════════
       LAYOUT
       NO position/z-index here — that was trapping the sidebar
    ══════════════════════════ */
    .layout { display: flex; min-height: 100vh; }

    /* ══════════════════════════
       SIDEBAR — desktop: sticky flow element
                 mobile:  fixed overlay (z-index:900)
    ══════════════════════════ */
    .sidebar {
      width: 252px;
      flex-shrink: 0;
      background: #090f1c;          /* always solid — no rgba, no blur */
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      /* desktop sticky */
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sb-header {
      padding: 22px 18px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, rgba(255,153,51,.07), rgba(19,136,8,.04));
      flex-shrink: 0;
    }
    .sb-logo { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
    .sb-emblem {
      width:42px; height:42px; border-radius:12px; flex-shrink:0;
      background: linear-gradient(135deg, var(--saffron), var(--saff2));
      display:flex; align-items:center; justify-content:center;
      font-size:20px;
      box-shadow: 0 4px 18px rgba(255,153,51,.45);
      animation: pulseLogo 3s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%,100% { box-shadow: 0 4px 18px rgba(255,153,51,.4); }
      50%      { box-shadow: 0 4px 32px rgba(255,153,51,.75); }
    }
    .sb-title h2   { font-family: var(--fh); font-size:17px; font-weight:700; line-height:1.2; }
    .sb-title .sb-sub { font-size:10.5px; color:var(--muted); letter-spacing:.07em; text-transform:uppercase; margin-top:2px; }

    .officer-chip {
      display: flex; align-items: center; gap:10px;
      background: rgba(255,153,51,.08);
      border: 1px solid rgba(255,153,51,.18);
      border-radius: 10px; padding:10px 12px;
    }
    .officer-avatar {
      width:34px; height:34px; border-radius:50%; flex-shrink:0;
      background: linear-gradient(135deg,#FF9933,#138808);
      display:flex; align-items:center; justify-content:center;
      font-size:15px; font-weight:700; color:var(--navy);
    }
    .officer-info strong { display:block; font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .officer-info span   { font-size:10.5px; color:var(--muted); }

    .sb-nav { padding:12px 8px; flex:1; overflow-y:auto; }
    .nav-lbl {
      font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
      color:var(--muted); padding:8px 12px 4px; margin-top:6px;
    }
    .sb-nav button {
      width:100%; padding:12px 14px; margin-bottom:2px;
      border:none; background:transparent; color:rgba(248,250,252,.65);
      border-radius:10px; cursor:pointer;
      font-size:13.5px; font-family:var(--fb); font-weight:500;
      transition: background .18s, color .18s, transform .18s;
      text-align:left; display:flex; align-items:center; gap:12px;
    }
    .sb-nav button .ni { font-size:16px; width:20px; text-align:center; flex-shrink:0; }
    .sb-nav button:hover  { background:rgba(255,153,51,.10); color:#fff; transform:translateX(3px); }
    .sb-nav button.active {
      background: linear-gradient(135deg,rgba(255,153,51,.2),rgba(255,153,51,.07));
      color: var(--saffron); border-left:3px solid var(--saffron);
    }
    .sb-footer {
      padding:14px 18px; border-top:1px solid var(--border);
      font-size:10.5px; color:var(--muted); text-align:center; flex-shrink:0;
    }

    /* ══════════════════════════
       OVERLAY  z:800  (below sidebar z:900)
       NO backdrop-filter — that's what blurred sidebar buttons
    ══════════════════════════ */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 800;
    }
    .overlay.open { display: block; }

    /* ══════════════════════════
       MAIN
    ══════════════════════════ */
    .main { flex:1; min-width:0; padding:16px; overflow-x:hidden; }

    /* ── TOPBAR ── */
    .topbar {
      display: flex; align-items:center; justify-content:space-between;
      background: var(--navy3); border:1px solid var(--border);
      border-radius:14px; padding:12px 18px; margin-bottom:18px;
      box-shadow: 0 6px 24px rgba(0,0,0,.3); gap:10px;
      animation: slideDown .5s ease both;
    }
    @keyframes slideDown { from{opacity:0;transform:translateY(-14px)} to{opacity:1;transform:none} }

    .topbar-l { display:flex; align-items:center; gap:12px; }
    .topbar-r { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; }

    .hamburger {
      display: none;
      width:38px; height:38px;
      border:1px solid rgba(255,153,51,.3); background:rgba(255,153,51,.1);
      border-radius:9px; cursor:pointer; font-size:20px; color:#fff;
      align-items:center; justify-content:center; flex-shrink:0;
      transition: background .2s;
    }
    .hamburger:hover { background:rgba(255,153,51,.22); }

    .page-title { font-family:var(--fh); font-size:20px; font-weight:700; letter-spacing:.02em; }
    .page-sub   { font-size:11.5px; color:var(--muted); }

    .online-badge {
      display:flex; align-items:center; gap:6px;
      background:rgba(19,136,8,.12); border:1px solid rgba(19,136,8,.28);
      border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:500;
    }
    .dot { width:7px; height:7px; background:var(--green); border-radius:50%; animation:blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    #userEmail {
      background: rgba(255,255,255,.06); border:1px solid var(--border);
      border-radius:999px; padding:6px 12px; font-size:12.5px;
      max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .logout-btn {
      padding:7px 14px; border:1px solid rgba(239,68,68,.38);
      background:rgba(239,68,68,.1); color:#f87171;
      border-radius:8px; cursor:pointer; font-size:12.5px;
      font-family:var(--fb); white-space:nowrap; transition:background .2s;
    }
    .logout-btn:hover { background:rgba(239,68,68,.22); }

    /* ── CONTENT ── */
    #content { animation:fadeUp .35s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }

    /* ── TICKER ── */
    .ticker {
      display:flex; align-items:center; gap:10px; overflow:hidden;
      background: linear-gradient(90deg,rgba(255,153,51,.09),rgba(19,136,8,.05));
      border:1px solid rgba(255,153,51,.15); border-radius:10px;
      padding:9px 16px; margin-bottom:18px;
    }
    .ticker-tag {
      font-family:var(--fh); font-size:10.5px; font-weight:700;
      letter-spacing:.1em; text-transform:uppercase;
      background:var(--saffron); color:var(--navy);
      padding:3px 8px; border-radius:5px; flex-shrink:0;
    }
    .ticker-wrap { overflow:hidden; flex:1; }
    .ticker-belt {
      display:flex; gap:60px; white-space:nowrap;
      animation: tickerRoll 32s linear infinite;
    }
    .ticker-belt span { font-size:12.5px; color:rgba(248,250,252,.78); }
    .ticker-belt span::before { content:'📌 '; }
    @keyframes tickerRoll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }

    /* ── STAT CARDS ── */
    .cards {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:14px; margin-bottom:18px;
    }
    .card {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:20px 18px;
      transition: transform .25s, box-shadow .25s;
      position:relative; overflow:hidden;
      animation: slideUp .45s ease both;
    }
    .card:nth-child(1){animation-delay:.04s}
    .card:nth-child(2){animation-delay:.09s}
    .card:nth-child(3){animation-delay:.14s}
    .card:nth-child(4){animation-delay:.19s}
    @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0;
      height:3px; border-radius:14px 14px 0 0;
    }
    .card.c1::before{background:linear-gradient(90deg,#FF9933,#ffcc00)}
    .card.c2::before{background:linear-gradient(90deg,#138808,#00c853)}
    .card.c3::before{background:linear-gradient(90deg,#3b82f6,#06b6d4)}
    .card.c4::before{background:linear-gradient(90deg,#8b5cf6,#ec4899)}
    .card:hover { transform:translateY(-5px); box-shadow:0 18px 44px rgba(0,0,0,.35); }
    .card-ico { font-size:24px; margin-bottom:10px; }
    .card h3  { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
    .card p   { font-family:var(--fh); font-size:30px; font-weight:700; line-height:1; }
    .card-chg { font-size:11.5px; margin-top:5px; }
    .up   { color:#4ade80; }
    .down { color:#f87171; }

    /* ── CHART BOX ── */
    .chart-box {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:20px; margin-bottom:18px;
    }
    .chart-box h3 {
      font-family:var(--fh); font-size:16px; font-weight:700;
      color:var(--saffron); margin-bottom:14px; letter-spacing:.02em;
    }

    /* ── INFO ROW ── */
    .info-row {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
      gap:14px; margin-top:18px;
    }
    .info-card {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:20px;
    }
    .info-card h4 {
      font-family:var(--fh); font-size:15px; color:var(--saffron);
      margin-bottom:12px; letter-spacing:.03em;
    }
    .info-item {
      display:flex; justify-content:space-between; align-items:center;
      padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04);
      font-size:13px; color:rgba(248,250,252,.75);
    }
    .info-item:last-child { border-bottom:none; }
    .info-item strong { color:#fff; }

    /* ── PROGRESS ── */
    .prog-item { margin-bottom:14px; }
    .prog-lbl  { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; color:rgba(248,250,252,.8); }
    .prog-bar  { height:6px; background:rgba(255,255,255,.06); border-radius:999px; overflow:hidden; }
    .prog-fill { height:100%; border-radius:999px; width:0; transition:width 1.2s cubic-bezier(.4,0,.2,1); }

    /* ── SECTION BOX ── */
    .section-box {
      background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:24px; animation:fadeUp .35s ease;
    }
    .section-box h2 { font-family:var(--fh); font-size:24px; font-weight:700; margin-bottom:4px; }
    .sub { font-size:12.5px; color:var(--muted); margin-bottom:18px; }
    .section-box > p { font-size:13.5px; color:rgba(248,250,252,.8); line-height:1.75; margin-bottom:12px; }

    /* ── TABLE ── */
    .tbl-wrap {
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-radius:12px; border:1px solid var(--border); margin-top:16px;
    }
    table { width:100%; border-collapse:collapse; min-width:480px; }
    th,td { padding:12px 14px; text-align:left; font-size:12.5px; }
    th {
      background:rgba(255,153,51,.09); color:var(--saffron);
      font-family:var(--fh); font-size:10.5px;
      letter-spacing:.09em; text-transform:uppercase; font-weight:700;
    }
    td { color:rgba(248,250,252,.78); border-bottom:1px solid rgba(255,255,255,.04); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:rgba(255,153,51,.04); }

    .badge {
      display:inline-block; padding:3px 10px; border-radius:999px;
      font-size:11.5px; font-weight:600;
    }
    .badge.active  { background:rgba(19,136,8,.18);   color:#4ade80;        border:1px solid rgba(19,136,8,.3); }
    .badge.pending { background:rgba(255,153,51,.13);  color:var(--saffron); border:1px solid rgba(255,153,51,.3); }
    .badge.closed  { background:rgba(148,163,184,.08); color:var(--muted);   border:1px solid var(--border); }
    .badge.review  { background:rgba(56,189,248,.12);  color:var(--sky);     border:1px solid rgba(56,189,248,.3); }

    /* ── SERVICE TILES ── */
    .svc-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
      gap:10px; margin-bottom:20px;
    }
    .svc-tile {
      background:#0d1e36; border:1px solid var(--border); border-radius:12px;
      padding:16px 8px; text-align:center; cursor:pointer;
      transition: all .22s; animation:slideUp .45s ease both;
    }
    .svc-tile:nth-child(1){animation-delay:.05s} .svc-tile:nth-child(2){animation-delay:.09s}
    .svc-tile:nth-child(3){animation-delay:.13s} .svc-tile:nth-child(4){animation-delay:.17s}
    .svc-tile:nth-child(5){animation-delay:.21s} .svc-tile:nth-child(6){animation-delay:.25s}
    .svc-tile:hover { background:rgba(255,153,51,.09); border-color:rgba(255,153,51,.3); transform:translateY(-3px) scale(1.02); }
    .svc-tile .ico  { font-size:24px; display:block; margin-bottom:6px; }
    .svc-tile span  { font-size:11.5px; color:rgba(248,250,252,.75); font-weight:500; line-height:1.3; }

    /* ── QUICK ACTION CARDS ── */
    .qa-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
      gap:12px; margin-bottom:18px;
    }
    .qa-card {
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding:18px 12px;
      background:var(--card); border:1px solid var(--border);
      border-radius:12px; cursor:pointer; text-align:center;
      transition: all .22s; animation:slideUp .45s ease both;
    }
    .qa-card:hover {
      background:rgba(255,153,51,.08); border-color:rgba(255,153,51,.3);
      transform:translateY(-4px); box-shadow:0 14px 36px rgba(0,0,0,.28);
    }
    .qa-card .qa-icon { font-size:26px; transition:transform .22s ease; }
    .qa-card:hover .qa-icon { transform:scale(1.18); }
    .qa-card h4 { font-family:var(--fh); font-size:13px; font-weight:700; }
    .qa-card p  { font-size:11px; color:var(--muted); line-height:1.4; }

    /* ── SECTION DIVIDER ── */
    .sec-div {
      font-family:var(--fh); font-size:11px; letter-spacing:.12em;
      text-transform:uppercase; color:var(--saffron);
      margin-bottom:14px; display:flex; align-items:center; gap:8px;
    }
    .sec-div::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.07); }

    /* ── TIMELINE ── */
    .tl-item { display:flex; gap:14px; margin-bottom:16px; animation:fadeUp .4s ease both; }
    .tl-side  { display:flex; flex-direction:column; align-items:center; }
    .tl-dot   { width:11px; height:11px; border-radius:50%; flex-shrink:0; margin-top:3px; }
    .tl-line  { width:2px; flex:1; background:var(--border); margin-top:4px; min-height:20px; }
    .tl-body  { padding-bottom:6px; }
    .tl-body h5 { font-size:13.5px; font-weight:600; margin-bottom:2px; }
    .tl-body p  { font-size:12px; color:var(--muted); }

    /* ── SETTINGS ── */
    .set-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:18px; }
    .frm-grp  { margin-bottom:13px; }
    .frm-grp label { display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); margin-bottom:6px; }
    .frm-grp input,
    .frm-grp select {
      width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border);
      border-radius:8px; padding:9px 12px; color:#fff;
      font-size:13px; font-family:var(--fb); outline:none; transition:border-color .2s;
    }
    .frm-grp input:focus, .frm-grp select:focus { border-color:rgba(255,153,51,.5); }
    .frm-grp select option { background:#112240; }
    .tog-row {
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0; border-bottom:1px solid rgba(255,255,255,.05);
      font-size:13px; color:rgba(248,250,252,.8);
    }
    .tog-row:last-of-type { border-bottom:none; }
    .tog { width:42px; height:22px; background:rgba(255,255,255,.1); border-radius:999px; cursor:pointer; position:relative; transition:background .2s; flex-shrink:0; }
    .tog.on { background:var(--green); }
    .tog::after { content:''; position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:left .2s; }
    .tog.on::after { left:23px; }
    .save-btn {
      margin-top:18px; padding:11px 26px;
      background: linear-gradient(135deg,var(--saffron),var(--saff2));
      border:none; border-radius:10px; color:var(--navy);
      font-weight:700; font-size:13.5px; font-family:var(--fb);
      cursor:pointer; transition:all .2s; box-shadow:0 4px 18px rgba(255,153,51,.3);
    }
    .save-btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(255,153,51,.4); }

    /* ── SCROLL REVEAL ── */
    .reveal { opacity:0; transform:translateY(14px); transition:opacity .5s ease, transform .5s ease; }
    .reveal.visible { opacity:1; transform:none; }


   .logo {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      height: 40px;
      max-width: 180px;
      object-fit: contain;
      object-position: left center;
    }


    /* ══════════════════════════
       TABLET
    ══════════════════════════ */
    @media (max-width:1024px) {
      .sidebar { width:220px; }
    }

    /* ══════════════════════════
       MOBILE  ≤ 768px

       THE KEY FIXES:
       1. .layout has NO position/z-index → no stacking context trap
       2. .sidebar switches to position:fixed with z-index:900
       3. .overlay z-index:800 (below sidebar)
       4. sidebar background is #090f1c (solid hex, not rgba)
       5. NO filter / backdrop-filter on sidebar ever
    ══════════════════════════ */
    @media (max-width:768px) {

      .hamburger { display:flex; }

      /* Full-height slide-in drawer */
      .sidebar {
        position: fixed !important;   /* must override sticky */
        top: 0;
        left: -270px;                 /* hidden off-screen */
        width: 252px;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        z-index: 900;                 /* above overlay(800) */
        /* solid hex so nothing shows through */
        background: #090f1c !important;
        /* destroy any filter inheritance */
        filter: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        /* no isolation needed since layout has no z-index */
        transition: left .28s cubic-bezier(.4,0,.2,1);
      }
      .sidebar.open { left: 0; }

      .layout { flex-direction: column; }
      .main   { padding:10px; }

      .topbar { padding:10px 12px; }
      .page-title { font-size:16px; }
      .online-badge { display:none; }
      #userEmail { max-width:100px; font-size:11.5px; padding:5px 9px; }
      .logout-btn { padding:6px 10px; font-size:11.5px; }

/* ══════════════════════════════════════
   SIDEBAR TOGGLE
   Uses event listeners only — no inline onclick
══════════════════════════════════════ */
var sidebar   = document.getElementById('sidebar');
var overlay   = document.getElementById('overlay');
var hamburger = document.getElementById('hamburger');

hamburger.addEventListener('click', function() {
  sidebar.classList.add('open');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
});

overlay.addEventListener('click', closeSidebar);

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeSidebar();
});

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

/* ══════════════════════════════════════
   NAVIGATION
   Wires up each button with addEventListener
   so inline onclick is never needed
══════════════════════════════════════ */
var SECTIONS = ['dashboard','applications','approvals','analytics','grievance','citizens','reports','settings'];

var TITLES = {
  dashboard:    'Dashboard',
  applications: 'Applications',
  approvals:    'Approval Queue',
  analytics:    'Analytics',
  grievance:    'Grievances',
  citizens:     'Citizens Directory',
  reports:      'Reports Centre',
  settings:     'Settings'
};

SECTIONS.forEach(function(sec) {
  var btn = document.getElementById('nb-' + sec);
  if (btn) {
    btn.addEventListener('click', function() { navigate(sec); });
  }
});

function navigate(section) {
  closeSidebar();
  /* update active state */
  SECTIONS.forEach(function(s) {
    var b = document.getElementById('nb-' + s);
    if (b) b.classList.remove('active');
  });
  var active = document.getElementById('nb-' + section);
  if (active) active.classList.add('active');
  /* update page title */
  document.getElementById('pageTitle').textContent = TITLES[section] || section;
  /* render section content */
  renderSection(section);
}

/* ══════════════════════════════════════
   HELPERS
══════════════════════════════════════ */
function buildTimeline(id, title, events) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '<h4 style="font-family:\'Rajdhani\',sans-serif;font-size:16px;color:#FF9933;margin-bottom:12px;">' + title + '</h4>'
    + events.map(function(e,i){
        return '<div class="tl-item" style="animation-delay:'+(i*.08)+'s">'
          +'<div class="tl-side"><div class="tl-dot" style="background:'+e.c+';box-shadow:0 0 7px '+e.c+'88"></div>'
          +(i<events.length-1?'<div class="tl-line"></div>':'')+'</div>'
          +'<div class="tl-body"><h5>'+e.t+'</h5><p>'+e.m+'</p></div></div>';
      }).join('');
}

function drawLineChart(id, labels, d1, d2) {
  setTimeout(function(){
    var ctx = document.getElementById(id);
    if (!ctx) return;
    new Chart(ctx,{
      type:'line',
      data:{labels:labels,
        datasets:[
          {label:'Applications',data:d1,borderColor:'#FF9933',backgroundColor:'rgba(255,153,51,.07)',borderWidth:2.5,pointBackgroundColor:'#FF9933',pointRadius:4,tension:.4,fill:true},
          {label:'Approved',    data:d2,borderColor:'#138808',backgroundColor:'rgba(19,136,8,.07)',  borderWidth:2.5,pointBackgroundColor:'#138808',pointRadius:4,tension:.4,fill:true},
        ]},
      options:{responsive:true,plugins:{legend:{labels:{color:'#94a3b8',font:{size:12}}}},
        scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,.04)'}}}}
    });
  },80);
}

function drawProgress(id, items) {
  var el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = items.map(function(it){
    return '<div class="prog-item"><div class="prog-lbl"><span>'+it.label+'</span><span>'+it.pct+'%</span></div>'
      +'<div class="prog-bar"><div class="prog-fill" data-pct="'+it.pct+'" style="background:'+it.color+'"></div></div></div>';
  }).join('');
  setTimeout(function(){
    el.querySelectorAll('.prog-fill').forEach(function(b){ b.style.width = b.dataset.pct+'%'; });
  },80);
}

function initReveal() {
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('visible'); obs.unobserve(e.target);} });
  },{threshold:0.06});
  document.querySelectorAll('.reveal').forEach(function(el){ obs.observe(el); });
}

function updateOfficerChip() {
  var email = localStorage.getItem('userEmail') || 'officer@gov.in';
  var name  = localStorage.getItem('officerName') || email.split('@')[0];
  var cap   = name.charAt(0).toUpperCase() + name.slice(1);
  document.getElementById('userEmail').textContent = email;
  document.getElementById('sbName').textContent    = cap;
  document.getElementById('sbAvatar').textContent  = cap.charAt(0).toUpperCase();
}
