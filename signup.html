<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>

  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>

    :root{
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --bg-dark:#0f172a;
      --card-bg:rgba(255,255,255,0.05);
      --border:rgba(255,255,255,0.12);
      --text:#f8fafc;
      --muted:#94a3b8;
      --input-bg:rgba(255,255,255,0.06);
      --shadow:0 20px 50px rgba(0,0,0,0.4);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Sora',sans-serif;
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      background:
      radial-gradient(circle at top left,#1d4ed8 0%,transparent 35%),
      radial-gradient(circle at bottom right,#4338ca 0%,transparent 35%),
      #0f172a;
      overflow:hidden;
      position:relative;
      padding:20px;
    }

    /* Background Orbs */

    body::before,
    body::after{
      content:"";
      position:absolute;
      border-radius:50%;
      filter:blur(90px);
      animation:move 8s infinite alternate ease-in-out;
    }

    body::before{
      width:300px;
      height:300px;
      background:rgba(37,99,235,0.3);
      top:-80px;
      left:-60px;
    }

    body::after{
      width:250px;
      height:250px;
      background:rgba(99,102,241,0.25);
      bottom:-80px;
      right:-50px;
    }

    @keyframes move{
      from{
        transform:translateY(0px);
      }
      to{
        transform:translateY(40px);
      }
    }

    /* Particles */

    .particles{
      position:absolute;
      inset:0;
      overflow:hidden;
      z-index:0;
    }

    .particle{
      position:absolute;
      width:6px;
      height:6px;
      background:rgba(255,255,255,0.15);
      border-radius:50%;
      animation:float 15s linear infinite;
    }

    .particle:nth-child(1){ left:10%; animation-duration:12s; }
    .particle:nth-child(2){ left:25%; animation-duration:18s; }
    .particle:nth-child(3){ left:40%; animation-duration:14s; }
    .particle:nth-child(4){ left:60%; animation-duration:20s; }
    .particle:nth-child(5){ left:75%; animation-duration:16s; }
    .particle:nth-child(6){ left:90%; animation-duration:13s; }

    @keyframes float{
      from{
        transform:translateY(100vh);
        opacity:0;
      }
      to{
        transform:translateY(-10vh);
        opacity:1;
      }
    }

    /* Signup Card */

    .signup-container{
      position:relative;
      z-index:2;
      width:min(450px,100%);
      padding:45px;
      border-radius:24px;
      background:var(--card-bg);
      backdrop-filter:blur(25px);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      animation:cardShow 1s ease;
    }

    @keyframes cardShow{
      from{
        opacity:0;
        transform:translateY(40px) scale(0.95);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }

    /* Header */

    .signup-header{
      text-align:center;
      margin-bottom:35px;
    }

    .signup-header h2{
      color:var(--text);
      font-size:32px;
      margin-bottom:8px;
    }

    .signup-header p{
      color:var(--muted);
      font-size:14px;
    }

    /* Inputs */

    .field{
      margin-bottom:20px;
    }

    .field label{
      display:block;
      margin-bottom:8px;
      color:#cbd5e1;
      font-size:13px;
      font-weight:600;
    }

    .input-box{
      position:relative;
    }

    .input-box input{
      width:100%;
      padding:14px 16px;
      border:none;
      outline:none;
      border-radius:14px;
      background:var(--input-bg);
      border:1px solid rgba(255,255,255,0.08);
      color:var(--text);
      font-size:15px;
      transition:0.3s;
    }

    .input-box input:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(37,99,235,0.25);
      background:rgba(37,99,235,0.08);
    }

    ::placeholder{
      color:#94a3b8;
    }

    /* Button */

    .signup-btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#2563eb,#4f46e5);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
      box-shadow:0 8px 25px rgba(37,99,235,0.4);
    }

    .signup-btn:hover{
      transform:translateY(-4px);
      box-shadow:0 15px 35px rgba(37,99,235,0.5);
    }

    /* Login Text */

    .login-text{
      text-align:center;
      margin-top:25px;
      color:var(--muted);
      font-size:14px;
    }

    .login-text a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:600;
      transition:0.3s;
    }

    .login-text a:hover{
      color:#93c5fd;
    }

    /* Toast */

    .toast{
      position:fixed;
      top:20px;
      left:50%;
      transform:translateX(-50%) translateY(-80px);
      background:#1e293b;
      color:#fca5a5;
      border:1px solid #ef4444;
      padding:12px 24px;
      border-radius:12px;
      transition:0.4s;
      z-index:999;
    }

    .toast.show{
      transform:translateX(-50%) translateY(0);
    }

    /* Tablet */

    @media(max-width:992px){

      .signup-container{
        width:70%;
      }

    }

    /* Mobile */

    @media(max-width:768px){

      .signup-container{
        width:100%;
        padding:35px 25px;
      }

      .signup-header h2{
        font-size:28px;
      }

    }

    /* Small Mobile */

    @media(max-width:480px){

      .signup-container{
        padding:30px 20px;
      }

      .signup-header h2{
        font-size:24px;
      }

    }

  </style>

</head>
<body>

  <!-- Particles -->

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- Toast -->

  <div class="toast" id="toast">
    Passwords do not match!
  </div>

  <!-- Signup Card -->

  <div class="signup-container">

    <div class="signup-header">
      <h2>Create Account</h2>
      <p>Signup to access your dashboard</p>
    </div>

    <form id="signupForm">

      <!-- Name -->

      <div class="field">
        <label>Full Name</label>

        <div class="input-box">
          <input
            type="text"
            placeholder="Enter your name"
            required
          >
        </div>
      </div>

      <!-- Email -->

      <div class="field">
        <label>Email Address</label>

        <div class="input-box">
          <input
            type="email"
            placeholder="Enter your email"
            required
          >
        </div>
      </div>

      <!-- Password -->

      <div class="field">
        <label>Password</label>

        <div class="input-box">
          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          >
        </div>
      </div>

      <!-- Confirm Password -->

      <div class="field">
        <label>Confirm Password</label>

        <div class="input-box">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
          >
        </div>
      </div>

      <!-- Button -->

      <button type="submit" class="signup-btn">
        Create Account
      </button>

    </form>

    <!-- Login Text -->

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

  <script>

    function showToast(message){

      const toast = document.getElementById("toast");

      toast.innerHTML = message;

      toast.classList.add("show");

      setTimeout(() => {

        toast.classList.remove("show");

      },3000);

    }

    document.getElementById("signupForm")
    .addEventListener("submit", function(e){

      e.preventDefault();

      let password =
      document.getElementById("password").value;

      let confirmPassword =
      document.getElementById("confirmPassword").value;

      // Check Passwords

      if(password !== confirmPassword){

        showToast("Passwords do not match!");

        return;

      }

      // Success

      showToast("Signup Successful!");

      setTimeout(() => {

        window.location.href = "login.html";

      },1500);

    });

  </script>

</body>
</html>
