<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-glow: rgba(37,99,235,0.35);
      --input-bg: rgba(255,255,255,0.06);
      --input-border: rgba(255,255,255,0.15);
      --text-primary: #f0f6ff;
      --text-muted: #94a3b8;
      --label: #cbd5e1;
      --radius: 14px;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: linear-gradient(180deg, #071728 0%, #102f54 40%, #1e427d 70%, #0f172a 100%);
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(37,99,235,0.25), transparent 70%);
      top: -100px;
      left: -80px;
    }

    body::after {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(99,102,241,0.18), transparent 70%);
      bottom: -80px;
      right: -60px;
      animation-delay: -6s;
      animation-duration: 10s;
    }

    @keyframes drift {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, 30px) scale(1.08);
      }
    }

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(147,197,253,0.18);
      animation: floatUp linear infinite;
    }

    .particle:nth-child(1){ width:4px; height:4px; left:10%; animation-duration:14s; }
    .particle:nth-child(2){ width:6px; height:6px; left:22%; animation-duration:18s; }
    .particle:nth-child(3){ width:3px; height:3px; left:38%; animation-duration:12s; }
    .particle:nth-child(4){ width:5px; height:5px; left:54%; animation-duration:16s; }
    .particle:nth-child(5){ width:4px; height:4px; left:70%; animation-duration:20s; }
    .particle:nth-child(6){ width:7px; height:7px; left:85%; animation-duration:15s; }
    .particle:nth-child(7){ width:3px; height:3px; left:92%; animation-duration:11s; }

    @keyframes floatUp {
      0% {
        transform: translateY(110vh) scale(0.8);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 0.6;
      }

      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    .page-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .login-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      background: rgba(5,24,44,0.92);
      backdrop-filter: blur(24px) saturate(1.3);
      padding: clamp(32px,6vw,56px) clamp(28px,6vw,48px);
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 90px rgba(0,0,0,0.45);
    }

    .card-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-ring {
      display: inline-flex;
      align-items:center;
      justify-content:center;
      width:60px;
      height:60px;
      border-radius:18px;
      background: linear-gradient(135deg,#1d4ed8,#4f46e5);
      margin-bottom:18px;
    }

    .logo-ring svg {
      width:28px;
      height:28px;
      fill:none;
      stroke:#fff;
      stroke-width:2;
    }

    .card-header h2 {
      font-size: 30px;
      font-weight:700;
    }

    .card-header p {
      font-size:14px;
      color:rgba(241,245,249,0.78);
      margin-top:8px;
    }

    .field {
      margin-bottom:20px;
    }

    .field label {
      display:block;
      font-size:12px;
      font-weight:600;
      letter-spacing:0.08em;
      text-transform:uppercase;
      color:var(--label);
      margin-bottom:8px;
    }

    .input-wrap {
      position:relative;
    }

    .input-wrap .icon {
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      color:var(--text-muted);
      display:flex;
    }

    .input-wrap select,
    .input-wrap input {
      width:100%;
      padding:14px 16px 14px 46px;
      background:var(--input-bg);
      border:1px solid var(--input-border);
      border-radius:var(--radius);
      font-size:15px;
      font-family:'Sora',sans-serif;
      color:var(--text-primary);
      appearance:none;
    }

    .input-wrap input:focus,
    .input-wrap select:focus {
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px var(--primary-glow);
    }

    .select-arrow {
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      color:var(--text-muted);
    }

    .pw-toggle {
      position:absolute;
      right:14px;
      top:50%;
      transform:translateY(-50%);
      background:none;
      border:none;
      cursor:pointer;
      color:var(--text-muted);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: -4px;
      margin-bottom: 20px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #2563eb;
      cursor: pointer;
    }

    .forgot-password {
      color: #60a5fa;
      font-size: 14px;
      text-decoration: none;
    }

    .forgot-password:hover {
      color: #93c5fd;
    }

    .btn-submit {
      width:100%;
      padding:16px 0;
      border:none;
      border-radius:var(--radius);
      background:linear-gradient(135deg,#2563eb,#4f46e5);
      color:#fff;
      font-size:16px;
      font-family:'Sora',sans-serif;
      font-weight:700;
      cursor:pointer;
      margin-top:8px;
    }

    .btn-submit span {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .divider {
      display:flex;
      align-items:center;
      gap:12px;
      margin:24px 0 20px;
    }

    .divider::before,
    .divider::after {
      content:'';
      flex:1;
      height:1px;
      background:var(--input-border);
    }

    .divider span {
      font-size:12px;
      color:var(--text-muted);
    }

    .signup-text {
      text-align:center;
      font-size:14px;
      color:var(--text-muted);
    }

    .signup-text a {
      color:#60a5fa;
      text-decoration:none;
      font-weight:600;
    }

  </style>
</head>

<body>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="page-wrap">

    <div class="login-container">

      <div class="card-header">

        <div class="logo-ring">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>

        <h2>Welcome Back</h2>
        <p>Sign in to continue to your dashboard</p>

      </div>

      <form id="loginForm">

        <!-- Role -->

        <div class="field">
          <label for="role">Your Role</label>

          <div class="input-wrap">

            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
              </svg>
            </span>

            <select name="role" id="role" required>
              <option value="">Select Role</option>
              <option value="citizen">Citizen</option>
              <option value="officer">Officer</option>
            </select>

            <span class="select-arrow">
              ▼
            </span>

          </div>
        </div>

        <!-- Email -->

        <div class="field">

          <label for="email">Email Address</label>

          <div class="input-wrap">

            <span class="icon">
              ✉
            </span>

            <input type="email" id="email" placeholder="Enter your email" required>

          </div>

        </div>

        <!-- Password -->

        <div class="field">

          <label for="password">Password</label>

          <div class="input-wrap">

            <span class="icon">
              🔒
            </span>

            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="button" class="pw-toggle" id="pwToggle">
              👁
            </button>

          </div>

        </div>

        <!-- Remember + Forgot -->

        <div class="remember-forgot">

          <label class="remember-me">
            <input type="checkbox">
            Remember Me
          </label>

          <a href="signup.html" class="forgot-password">
            Forgot Password?
          </a>

        </div>

        <!-- Button -->

        <button type="submit" class="btn-submit">

          <span>
            Sign In
          </span>

        </button>

      </form>

      <div class="divider">
        <span>New here?</span>
      </div>

      <p class="signup-text">
        Don't have an account?
        <a href="signup.html">Create one</a>
      </p>

    </div>

  </div>

  <script>

    const pwToggle = document.getElementById('pwToggle');
    const password = document.getElementById('password');

    pwToggle.addEventListener('click', () => {

      if(password.type === 'password') {
        password.type = 'text';
        pwToggle.innerHTML = '🙈';
      } else {
        password.type = 'password';
        pwToggle.innerHTML = '👁';
      }

    });

    document.getElementById("loginForm")
    .addEventListener("submit", function(e){

      e.preventDefault();

      let role = document.getElementById("role").value;
      let email = document.getElementById("email").value;

      localStorage.setItem("userEmail", email);

      if(role === "citizen") {
        window.location.href = "citizenDashboard.html";
      }

      else if(role === "officer") {
        window.location.href = "officerDashboard.html";
      }

      else {
        alert("Please select role");
      }

    });

  </script>

</body>
</html>
