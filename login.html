<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-glow: rgba(37,99,235,0.35);
      --input-bg: rgba(255,255,255,0.06);
      --input-border: rgba(255,255,255,0.15);
      --text-primary: #f0f6ff;
      --text-muted: #94a3b8;
      --label: #cbd5e1;
      --radius: 14px;
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: linear-gradient(180deg, #071728 0%, #102f54 40%, #1e427d 70%, #0f172a 100%);
      color: var(--text-primary);
      position: relative;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(37,99,235,0.25), transparent 70%);
      top: -100px; left: -80px;
    }

    body::after {
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(99,102,241,0.18), transparent 70%);
      bottom: -80px; right: -60px;
      animation-delay: -6s; animation-duration: 10s;
    }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.08); }
    }

    .particles {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0; overflow: hidden;
    }

    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(147,197,253,0.18);
      animation: floatUp linear infinite;
    }

    .particle:nth-child(1){ width:4px; height:4px; left:10%; animation-duration:14s; }
    .particle:nth-child(2){ width:6px; height:6px; left:22%; animation-duration:18s; }
    .particle:nth-child(3){ width:3px; height:3px; left:38%; animation-duration:12s; }
    .particle:nth-child(4){ width:5px; height:5px; left:54%; animation-duration:16s; }
    .particle:nth-child(5){ width:4px; height:4px; left:70%; animation-duration:20s; }
    .particle:nth-child(6){ width:7px; height:7px; left:85%; animation-duration:15s; }
    .particle:nth-child(7){ width:3px; height:3px; left:92%; animation-duration:11s; }

    @keyframes floatUp {
      0%   { transform:translateY(110vh) scale(0.8); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:0.6; }
      100% { transform:translateY(-10vh) scale(1.2); opacity:0; }
    }

    .page-wrap {
      position: relative; z-index: 10;
      width: 100%; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }

    .login-container {
      position: relative; width: 100%; max-width: 500px;
      background: rgba(5,24,44,0.92);
      backdrop-filter: blur(24px) saturate(1.3);
      padding: clamp(32px,6vw,56px) clamp(28px,6vw,48px);
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 32px 90px rgba(0,0,0,0.45);
    }

    .card-header {
      text-align: center; margin-bottom: 36px;
    }

    .logo-ring {
      display: inline-flex; align-items: center; justify-content: center;
      width: 60px; height: 60px; border-radius: 18px;
      background: linear-gradient(135deg,#1d4ed8,#4f46e5);
      margin-bottom: 18px;
    }

    .logo-ring svg {
      width: 28px; height: 28px;
      fill: none; stroke: #fff; stroke-width: 2;
    }

    .card-header h2 { font-size: 30px; font-weight: 700; }

    .card-header p {
      font-size: 14px; color: rgba(241,245,249,0.78); margin-top: 8px;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block; font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--label); margin-bottom: 8px;
    }

    /* ── Generic input wrap ── */
    .input-wrap { position: relative; }

    .input-wrap .icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%); color: var(--text-muted);
      display: flex; align-items: center; pointer-events: none;
      z-index: 2;
    }

    .input-wrap input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      font-size: 15px; font-family: 'Sora', sans-serif;
      color: var(--text-primary);
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    /* ── Custom select ── */
    .select-wrap { position: relative; }

    /* Hidden native select — still interactive for accessibility / form submit */
    /* .select-wrap select {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer; z-index: 3;
    } */
     .select-wrap select {
     display: none;
}

    /* Visible styled face */
    .select-face {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      padding: 14px 46px 14px 46px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      font-size: 15px; font-family: 'Sora', sans-serif;
      color: var(--text-muted);          /* placeholder colour */
      cursor: pointer;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s, color 0.25s;
      user-select: none;
      position: relative; z-index: 1;
    }

    /* When a real value is chosen, the face text turns white */
    .select-face.selected {
      color: var(--text-primary);
    }

    /* Focus ring mirrors input behaviour */
    .select-wrap:focus-within .select-face,
    .select-face:hover {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
      background: rgba(37,99,235,0.08);
    }

    /* Left icon inside select */
    .select-face .sf-icon {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); display: flex; align-items: center;
      pointer-events: none;
    }

    /* Right chevron */
    .select-face .sf-arrow {
      position: absolute; right: 16px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); font-size: 11px;
      pointer-events: none;
      transition: transform 0.2s;
    }

    /* Rotate arrow when native select is open (focus-within trick) */
    .select-wrap:focus-within .sf-arrow {
      transform: translateY(-50%) rotate(180deg);
    }

    /* ── Custom dropdown list ── */
    .custom-options {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: #0d2240;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      z-index: 100;
      display: none;       /* toggled by JS */
      animation: dropIn 0.18s ease;
    }

    .custom-options.open { display: block; }

    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .custom-option {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 18px;
      font-size: 15px; font-family: 'Sora', sans-serif;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .custom-option:not(:last-child) {
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .custom-option:hover,
    .custom-option.active {
      background: rgba(37,99,235,0.18);
      color: #93c5fd;
    }

    .custom-option svg {
      width: 16px; height: 16px; flex-shrink: 0;
      stroke: currentColor; fill: none; stroke-width: 2;
    }

    /* ── pw toggle ── */
    .pw-toggle {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); display: flex; align-items: center;
      transition: color 0.2s;
    }

    .pw-toggle:hover { color: #e2e8f0; }

    .pw-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

    .eye-off { display: none; }
    .pw-toggle.visible .eye-on  { display: none; }
    .pw-toggle.visible .eye-off { display: block; }

    /* ── remember / forgot ── */
    .remember-forgot {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: -4px; margin-bottom: 20px;
    }

    .remember-me {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: 14px; cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 16px; height: 16px; accent-color: #2563eb; cursor: pointer;
    }

    .forgot-password {
      color: #60a5fa; font-size: 14px; text-decoration: none;
    }

    .forgot-password:hover { color: #93c5fd; }

    /* ── submit btn ── */
    .btn-submit {
      width: 100%; padding: 16px 0; border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg,#2563eb,#4f46e5);
      color: #fff; font-size: 16px; font-family: 'Sora', sans-serif;
      font-weight: 700; cursor: pointer; margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(37,99,235,0.45);
    }

    .btn-submit span {
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0 20px;
    }

    .divider::before,
    .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--input-border);
    }

    .divider span { font-size: 12px; color: var(--text-muted); }

    .signup-text {
      text-align: center; font-size: 14px; color: var(--text-muted);
    }

    .signup-text a {
      color: #60a5fa; text-decoration: none; font-weight: 600;
    }

  </style>
</head>

<body>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="page-wrap">
    <div class="login-container">

      <div class="card-header">
        <div class="logo-ring">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to continue to your dashboard</p>
      </div>

      <form id="loginForm">

        <!-- ── Role (fully custom dropdown) ── -->
        <div class="field">
          <label>Your Role</label>

          <div class="select-wrap" id="selectWrap">

            <!-- Invisible native select keeps form submit working -->
            <select name="role" id="role"  tabindex="-1" aria-hidden="true">
              <option value="">Select Role</option>
              <option value="citizen">Citizen</option>
              <option value="officer">Officer</option>
            </select>

            <!-- Visible face — clicking this opens the custom list -->
            <div class="select-face" id="selectFace" tabindex="0"
                 role="combobox" aria-haspopup="listbox" aria-expanded="false">

              <!-- person icon -->
              <span class="sf-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                  <circle cx="9" cy="7" r="4"/>
                </svg>
              </span>

              <span id="selectText">Select Role</span>

              <span class="sf-arrow">▼</span>
            </div>

            <!-- Custom option list -->
            <div class="custom-options" id="customOptions" role="listbox">

              <div class="custom-option" data-value="citizen" role="option">
                <svg viewBox="0 0 24 24">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
                Citizen
              </div>

              <div class="custom-option" data-value="officer" role="option">
                <svg viewBox="0 0 24 24">
                  <rect x="2" y="7" width="20" height="14" rx="2"/>
                  <path d="M16 3H8l-1 4h10l-1-4z"/>
                  <circle cx="12" cy="14" r="2"/>
                </svg>
                Officer
              </div>
            </div>
            <!-- Error message for role selection -->
            <p id="roleError" style="color:red; font-size:13px; margin-top:6px;"></p>
          </div>
        </div>

        <!-- ── Email ── -->
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M2 8l10 6 10-6"/>
              </svg>
            </span>
            <input
             type="text"
             id="email" 
             placeholder="Enter your email"
             required 
             
             >
          </div>
        </div>

        <!-- ── Password ── -->
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password">
              <!-- eye open -->
              <svg class="eye-on" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- eye off -->
              <svg class="eye-off" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- ── Remember + Forgot ── -->
        <div class="remember-forgot">
          <label class="remember-me">
            <input type="checkbox"> Remember Me
          </label>
          <a href="404ErrorPage.html" class="forgot-password">Forgot Password?</a>
        </div>

        <!-- ── Submit ── -->
        <button type="submit" class="btn-submit">
          <span>Sign In</span>
        </button>

      </form>

      <div class="divider"><span>New here?</span></div>

      <p class="signup-text">
        Don't have an account? <a href="signup.html">Create one</a>
      </p>

    </div>
  </div>

  <script>
    /* ── Custom role selector ── */
    const selectWrap   = document.getElementById('selectWrap');
    const selectFace   = document.getElementById('selectFace');
    const selectText   = document.getElementById('selectText');
    const customOptions = document.getElementById('customOptions');
    // const nativeSelect  = document.getElementById('role');
    // const options       = customOptions.querySelectorAll('.custom-option');
    const nativeSelect  = document.getElementById('role');
    const options       = customOptions.querySelectorAll('.custom-option');

    /* Reset role on page load */
    nativeSelect.value = '';
    selectText.textContent = 'Select Role';

    function openDropdown() {
      customOptions.classList.add('open');
      selectFace.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown() {
      customOptions.classList.remove('open');
      selectFace.setAttribute('aria-expanded', 'false');
    }

    function toggleDropdown() {
      customOptions.classList.contains('open') ? closeDropdown() : openDropdown();
    }

    // Click on face OR the invisible native select button both open the list
    selectFace.addEventListener('click', toggleDropdown);
    selectFace.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDropdown(); }
      if (e.key === 'Escape') closeDropdown();
    });

    options.forEach(function(opt) {
      opt.addEventListener('click', function() {
        var val   = opt.getAttribute('data-value');
        var label = opt.textContent.trim();

        // sync hidden native select
        nativeSelect.value = val;

        // update face
        selectText.textContent = label;
        selectFace.classList.add('selected');
        document.getElementById('roleError').textContent = '';

        // mark active
        options.forEach(function(o) { o.classList.remove('active'); });
        opt.classList.add('active');

        closeDropdown();
        selectFace.focus();
      });
    });

    // Close when clicking outside
    document.addEventListener('click', function(e) {
      if (!selectWrap.contains(e.target)) closeDropdown();
    });

    /* ── Password toggle ── */
    const pwToggle = document.getElementById('pwToggle');
    const pwInput  = document.getElementById('password');
    

    pwToggle.addEventListener('click', function() {
      var hidden = pwInput.type === 'password';
      pwInput.type = hidden ? 'text' : 'password';
      pwToggle.classList.toggle('visible', hidden);
      pwToggle.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
      
    });

    /* ── Form submit ── */
    document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var role  = nativeSelect.value;
  var email = document.getElementById('email');
  if(role === ''){
  document.getElementById('roleError').textContent =
  'Please select a role';
  return;
}

  // Email validation
  const emailValue = email.value;

if (
  !emailValue.includes('@') ||
  !emailValue.includes('.', emailValue.indexOf('@'))
) {
  alert('Please enter valid email');
  email.focus();
  return;
}

  localStorage.setItem('userEmail', email.value);

  if (role === 'citizen') {
    window.location.href = 'citizenDashboard.html';
  }
  else if (role === 'officer') {
    window.location.href = 'officerDashboard.html';
  }
  else {
  document.getElementById('roleError').textContent =
  'Please select a role';
}

});
    //});
  </script>

</body>
</html>
